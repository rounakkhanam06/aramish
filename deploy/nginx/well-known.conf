# Deep-link verification files for Android App Links and iOS Universal Links.
#
# OPTIONAL on the current VPS: its existing config already serves /.well-known/assetlinks.json
# as 200 application/json (verified 2026-09-24). The only gap is apple-app-site-association,
# which has no extension and is served as application/octet-stream; this snippet fixes that.
# The `aramish` SSH user can't edit nginx; it needs root / CloudPanel access.
#
# Include this inside the `server { ... }` block(s) for aramishshoes.com AND www.aramishshoes.com
# (HTTPS, port 443), ABOVE the SPA fallback `location / { try_files ... /index.html; }`:
#
#     include /etc/nginx/snippets/aramish-well-known.conf;
#
# Requirements this satisfies:
#   - served over HTTPS with status 200 (never the SPA index.html, never a 301/302)
#   - Content-Type: application/json (the Apple file has no extension, so default_type is needed)
#   - `^~` wins over regex locations such as `location ~ /\. { deny all; }` that block dot-paths
#
# The files come from the frontend build output (Frontend/dist/.well-known/), so this uses the
# same `root` as the rest of the server block. Set `root` here only if the site root differs.

location ^~ /.well-known/ {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
}
